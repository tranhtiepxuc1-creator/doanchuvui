<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9e5ed">
  <title>Đoán Chữ</title>
  <style>
    :root{--bg:#fff0f6;--card:#fffafd;--ink:#49364b;--muted:#8e7c92;--green:#58a66b;--yellow:#e7b33f;--blue:#426ebd;--purple:#9560d8;--red:#a82d45;--line:#c9afe7;--shadow:0 12px 30px #b67fa522}
    *{box-sizing:border-box;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#fff9da 0 5%,transparent 20%),radial-gradient(circle at 92% 18%,#f2dcff 0 5%,transparent 22%),linear-gradient(145deg,#fff0f6,#fff8f2 64%,#f1e9ff);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
    .app{width:min(100%,520px);margin:0 auto}.brand{margin:8px 0 18px;text-align:center;color:#8b55b2;font-size:clamp(25px,7vw,36px);font-weight:950;letter-spacing:.03em;text-shadow:0 2px 0 #fff}.credit{display:block;margin-top:5px;color:#c15b8b;font-size:12px;letter-spacing:0;font-weight:750}
    .panel{background:#fffdf6ed;border:2px solid #fff;border-radius:28px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
    .entry{display:flex;gap:10px}.entry input{min-width:0;flex:1;height:58px;padding:0 15px;border:2px solid #f1d8ee;border-radius:18px;background:white;font:600 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);outline:none}.entry input:focus{border-color:#c58ad9;box-shadow:0 0 0 4px #eacdf344}.entry button,.action{border:0;border-radius:18px;background:#ffc95e;color:#593b17;font-weight:900;font-size:17px;padding:0 20px;box-shadow:0 4px 0 #e7a944;cursor:pointer;transition:transform .15s,filter .15s}.entry button:active,.action:active{transform:translateY(2px);box-shadow:0 1px 0 #c78c25}
    .legend{margin:12px 0 17px;display:grid;grid-template-columns:1fr 1.35fr;gap:6px 9px;font-size:13px;font-weight:750;line-height:1.25}.legend div{display:flex;align-items:center;gap:7px}.dot{width:15px;height:15px;display:inline-block;flex:none;border-radius:4px}.g{background:var(--green)}.y{background:var(--yellow)}.b{background:var(--blue)}.p{background:var(--purple)}
    .board{display:grid;gap:9px;justify-content:center;margin:12px auto 16px;max-width:100%;overflow:visible}.row{display:flex;justify-content:center;gap:4px;align-items:center}.tile{width:var(--tile-size,42px);height:var(--tile-size,42px);flex:none;border:3px solid var(--line);border-radius:14px;display:grid;place-items:center;background:#fff;font-size:clamp(12px,4.5vw,24px);font-weight:850;text-transform:uppercase;color:#fff}.tile.empty{background:#fffafd;color:var(--ink);box-shadow:0 3px 0 #eadbf3}.tile.g{border-color:var(--green);background:var(--green)}.tile.y{border-color:var(--yellow);background:var(--yellow)}.tile.b{border-color:var(--blue);background:var(--blue)}.tile.p{border-color:var(--purple);background:var(--purple)}.tile.g,.tile.y,.tile.b,.tile.p{color:white}.gap{width:10px;flex:none}
    .status{min-height:24px;text-align:center;font-weight:700;font-size:14px;margin:4px 0 12px;color:#625865}.status.error{color:#a82d45}.status.good{color:#36784a}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.action{padding:11px 17px;font-size:14px;background:#f6e6ff;box-shadow:0 4px 0 #dfc4ee;color:#75418a}.action.hintAction{background:#fff0ae;color:#73541d;box-shadow:0 4px 0 #e5cc72}.action:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.3)}.hint-box{margin:0 auto 10px;padding:10px 14px;width:fit-content;max-width:100%;border:1px dashed #d7a7db;border-radius:16px;background:#fff2fb;color:#8e4d94;font-weight:750;font-size:14px;text-align:center}.hint-box[hidden]{display:none}.attempts{text-align:center;color:#977fa1;font-size:13px;margin-top:9px}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:10px 16px;border-radius:12px;background:#392f3b;color:white;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    #modWidget{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}#modPanel{width:210px;padding:12px;border-radius:16px;background:#30283a;color:white;box-shadow:0 8px 28px #241a2c55}#modPanel[hidden]{display:none}.modTitle{font-size:12px;font-weight:900;letter-spacing:.08em;color:#f5c65c;margin:0 0 8px}.modAction{width:100%;margin-top:6px;border:0;border-radius:10px;padding:10px;background:#fff;color:#382f3a;font:750 13px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}.modAction.primary{background:#e9ad3e;color:#382608}.modToggle{border:2px solid #fff;border-radius:999px;background:#30283a;color:#f5c65c;font:900 14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:11px 16px;box-shadow:0 4px 14px #241a2c44;cursor:pointer}#modPanel p{font-size:11px;line-height:1.35;color:#ddd5e3;margin:0} 
    .celebration{position:fixed;inset:0;z-index:45;overflow:hidden;pointer-events:none}.confetti{position:absolute;top:-22px;left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:confettiFall 2.8s ease-in var(--d) forwards}@keyframes confettiFall{to{transform:translateY(112vh) rotate(760deg);opacity:.2}}.victory-banner{position:fixed;z-index:46;top:14%;left:50%;width:min(90vw,440px);padding:17px 20px;border:2px solid #ffe392;border-radius:22px;background:linear-gradient(135deg,#fff7d9,#fff);box-shadow:0 12px 40px #7a4f3444;text-align:center;color:#276c3c;display:flex;align-items:center;justify-content:center;gap:12px;opacity:0;transform:translate(-50%,-20px) scale(.72);pointer-events:none}.victory-banner.show{animation:victoryPop .45s cubic-bezier(.2,1.5,.5,1) forwards, victoryGlow 1s ease-in-out .45s 3 alternate}.victory-banner .win-icon{font-size:40px;animation:trophyBounce .65s ease-in-out infinite alternate}.victory-banner strong{font-size:clamp(16px,4.5vw,21px);line-height:1.35}@keyframes victoryPop{to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes victoryGlow{to{box-shadow:0 12px 44px #f0b42c88}}@keyframes trophyBounce{to{transform:translateY(-7px) rotate(-8deg)}}
    @media(max-width:360px){body{padding-inline:10px}.panel{padding:12px}.tile{border-radius:8px;border-width:2px}.legend{font-size:11.5px}.entry button{padding:0 15px}}
  </style>
</head>
<body>
  <main class="app">
    <h1 class="brand">🎀 ĐOÁN CHỮ ✨ <span class="credit">Made by Luwu Bij (@trailomlinh)</span></h1>
    <section class="panel" aria-label="Trò chơi đoán chữ">
      <form class="entry" id="guessForm" autocomplete="off">
        <input id="guessInput" type="text" placeholder="Nhập hai từ theo số ô" aria-label="Nhập cụm từ theo số ô" autocapitalize="off" spellcheck="false">
        <button type="submit">Đoán</button>
      </form>
      <div class="legend" aria-label="Chú giải màu">
        <div style="color:var(--green)"><i class="dot g"></i>Đúng chữ, chỗ</div>
        <div style="color:var(--blue)"><i class="dot b"></i>Đúng chỗ, sai dấu</div>
        <div style="color:#c48f25"><i class="dot y"></i>Có trong cụm, sai chỗ</div>
        <div style="color:var(--purple)"><i class="dot p"></i>Không có trong cụm</div>
      </div>
      <div class="board" id="board" aria-label="Bảng đoán 6 lượt với độ dài từ thay đổi"></div>
      <div class="hint-box" id="hintBox" hidden aria-live="polite"></div>
      <div class="status" id="status" role="status" aria-live="polite">Đoán cụm hai từ theo số ô trong bảng.</div>
      <div class="controls">
        <button class="action" id="newGame" type="button">🌸 Ván mới</button>
        <button class="action hintAction" id="getHint" type="button">💡 Gợi ý cụm từ</button>
      </div>
      <div class="attempts" id="attempts">Còn 6 lượt</div>
    </section>
  </main>
  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <div class="victory-banner" id="victoryBanner" aria-live="polite"><span class="win-icon">🏆</span><strong id="victoryText">Chính xác!</strong></div>

  function graphemes(text) {
    const s = text.normalize('NFC');
    return segmenter ? Array.from(segmenter.segment(s), x => x.segment) : Array.from(s);
  }
  function cleanPhrase(text) {
    return text.normalize('NFC').toLocaleLowerCase('vi').trim().replace(/\s+/g, ' ');
  }
  function validPhrase(text) {
    const parts = cleanPhrase(text).split(' ');
    return parts.length === 2 && parts.every(p => graphemes(p).length >= 2 && graphemes(p).length <= 6 && /^[\p{L}]+$/u.test(p));
  }
  function letters(text) { return graphemes(cleanPhrase(text).replace(/ /g, '')); }
  function lengthsOf(text) { return cleanPhrase(text).split(' ').map(w => graphemes(w).length); }
  function patternOf(text) { return lengthsOf(text).join('+'); }
  function validGuess(text) { return validPhrase(text) && !!state.answer && patternOf(text) === patternOf(state.answer); }
  function baseLetter(g) {
    return g.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g,'d').replace(/Đ/g,'D').toLocaleLowerCase('vi');
  }

    return cleanAnswers.filter(a => !blocked.has(a));

  function evaluate(guess, answer) {
    const g = letters(guess), a = letters(answer), result = Array(g.length).fill('p');
    const remaining = a.slice();
    for (let i=0;i<g.length;i++) if (g[i] === a[i]) { result[i]='g'; remaining[i]=null; }
    for (let i=0;i<g.length;i++) {
      if (result[i] === 'g') continue;
      if (baseLetter(g[i]) === baseLetter(a[i])) { result[i]='b'; const j=remaining.findIndex(x => x && baseLetter(x) === baseLetter(g[i])); if (j>=0) remaining[j]=null; }

    'tận tâm':'Khi làm một việc bằng cả phần chú ý mà người khác thường bỏ quên.',
    'nết na':'Vẻ dịu dàng kín đáo thường được nhận ra qua cách cư xử.',
    'đoan trang':'Phong thái nghiêm cẩn mà không cần lên tiếng đòi chú ý.',
    'nhã nhặn':'Lời nói có cạnh sắc được mài đi trước khi trao cho người khác.',
    'lễ phép':'Cách cư xử cho thấy ta nhìn thấy người đối diện, chứ không chỉ bản thân.',
    'khiêm tốn':'Biết mình có gì mà không cần đặt nó lên bàn cho mọi người xem.',
    'chân thành':'Điều thật lòng không cần trang trí quá nhiều để được tin.',
    'đồng lòng':'Nhiều ý nghĩ cùng hướng về một phía, dù mỗi người có một bước chân.',
    'chung sức':'Việc nặng bỗng nhẹ đi khi nhiều đôi tay cùng góp mặt.',
    'hợp tác':'Hai khả năng khác nhau cùng làm nên điều một người khó hoàn thành.',
    'đoàn kết':'Nhiều nhánh riêng tạo thành một sợi dây khó bẻ hơn.',
    'thành công':'Đích đến khiến những lần thử trước đó bỗng có ý nghĩa.',
    'may mắn':'Vị khách không hẹn mà đôi khi xuất hiện đúng lúc.',
    'hạnh phúc':'Cảm giác đủ đầy thường không cần phải sở hữu thật nhiều.',
    'ấm lòng':'Sự dịu dàng có thể sưởi ấm dù căn phòng vẫn lạnh.',
    'vững tin':'Niềm chắc chắn giúp bàn chân không dừng lại giữa sương mù.',
    'ước mơ':'Điều chưa có thật nhưng vẫn khiến người ta thức dậy để tiến gần.',
    'hy vọng':'Đốm sáng nhỏ không xóa bóng tối, nhưng giúp ta biết hướng đi.',
    'niềm tin':'Cây cầu vô hình nối điều chưa thấy với bước chân hiện tại.',
    'lạc quan':'Cách nhìn tìm cửa sổ ngay cả khi căn phòng đang tối.',
    'bình tâm':'Mặt nước trong lòng lặng lại trước khi quyết định điều gì.',
    'mỗi ngày':'Một đơn vị thời gian nhỏ, cứ đến rồi đi mà không đợi ai.',
    'sớm mai':'Khoảnh khắc bóng tối nhường chỗ cho tiếng chim đầu tiên.',
    'ban mai':'Phần đầu của ngày khi ánh sáng còn mềm như lời chào.',
    'chiều tà':'Ranh giới khi mặt trời thấp dần và ngày bắt đầu khép cửa.',
    'hoàng hôn':'Màn kết thúc nhuộm trời bằng màu lửa nhưng không đốt cháy gì.',
    'bình minh':'Khoảnh khắc ánh sáng đầu tiên mở khóa đường chân trời.',
    'đêm khuya':'Giờ mà tiếng động nhỏ cũng nghe như đang kể chuyện.',
    'trưa hè':'Lúc bóng cây ngắn lại và cái nóng chiếm gần hết con đường.',
    'ngày vui':'Một ô lịch bình thường bỗng được khoanh tròn bằng nụ cười.',
    'ngày thơ':'Ngày mà lời chúc thường đi cùng những vần điệu.'
  };
  const clueTopics = [
    {terms:['hoa','sen','lan','mai','đào','cúc','súng','cau','tre','lúa','cây','lá','rau','mầm','lộc','vườn'],text:'Hãy nghĩ tới một hình ảnh sống động của thiên nhiên; ý nghĩa của cả cụm nằm ở cách hai phần ghép thành một cảnh.'},
    {terms:['mây','mưa','sao','trăng','nắng','gió','trời','sương','xuân','hạ','hè','thu','đêm','sớm','mai','chiều','trưa','ngày'],text:'Đáp án mượn chất liệu từ bầu trời hoặc thời gian; điều quan trọng là sắc thái mà cả cụm gợi ra, không phải vật thể riêng lẻ.'},
    {terms:['nai','voi','sâu','cua','ong','tôm','cá','gà','vịt','chim','bướm','thỏ','sóc','dê','bò','ngựa','mèo','con'],text:'Trong cụm có bóng dáng của một sinh linh; hãy tìm nét đặc trưng khiến hình ảnh ấy trở nên quen thuộc.'},
    {terms:['bánh','bún','cơm','nước','mì','kem','kẹo','trà','cà','chè','đậu','khoai','bắp','ngô','canh','rau','mứt','sinh'],text:'Cả cụm có thể đánh thức một giác quan rất nhanh; nhưng hãy nghĩ đến nguồn gốc hoặc dịp người ta thường gặp nó.'},
    {terms:['tình','lòng','tâm','vui','tin','nhớ','mến','quý','yêu','thương','ước','hy','hạnh','an','bình'],text:'Đáp án không phải thứ có thể cầm nắm; manh mối nằm trong cảm giác hoặc mối quan hệ mà nó gợi ra.'},
    {terms:['thơ','ca','văn','lời','sách','câu','bài','tiếng','giọng','chữ'],text:'Cụm này sống trong thế giới của ngôn từ hoặc âm thanh; thử tìm điều còn đọng lại sau khi lời nói kết thúc.'},
    {terms:['núi','đồi','biển','sông','bờ','bến','rừng','đất','suối','sóng','đồng','quê','phố','ga','sân','đường','ngõ'],text:'Một địa điểm hoặc cảnh quan có thể giúp bạn hình dung cụm này; hãy chú ý cảm giác nơi ấy để lại hơn là tên gọi.'},
    {terms:['đèn','bút','kim','bàn','ghế','tủ','bếp','khăn','gối','chăn','áo','nón','mũ','giày','túi','va','xe','tàu','máy','phi'],text:'Đáp án gắn với một vật dụng hoặc chuyến đi; mối liên hệ giữa hai từ mới là chìa khóa, không phải bản thân món đồ.'},
    {terms:['bạn','nhà','gia','thầy','cô','em','bé','trẻ','ông'],text:'Cụm từ gợi một vai trò hoặc nơi chốn thân thuộc; thử nghĩ xem nó thường xuất hiện trong ký ức nào.'},
    {terms:['hào','tài','chí','khéo','tinh','thành','may','dũng','can','tử','hiền','thật','ngay','tận','đẹp'],text:'Đây là cách gọi một phẩm chất hay trạng thái; hãy tìm nét tính cách hoặc năng lực nằm sau lời khen.'}
  ];
  function hintMessage() {
    const answer=cleanPhrase(state.answer);
    if(crypticClues[answer]) return '🧩 Manh mối hóc búa: '+crypticClues[answer];
    const words=answer.split(' ');
    for(const topic of clueTopics){if(words.some(w=>topic.terms.includes(w)))return '🧩 Manh mối hóc búa: '+topic.text;}
    return '🧩 Manh mối hóc búa: Hãy nghĩ đến hình ảnh hoặc cảm giác mà cả cụm tạo nên; nghĩa không nằm trọn trong riêng từ nào.';
  }
  function giveHint() {
    if(!state.answer||state.done){showToast('Bắt đầu ván mới để nhận gợi ý nhé!');return;}
    if(state.clueShown){showToast('Gợi ý của ván này đã mở rồi nhé!');return;}
    state.clueShown=true; save(); render();
  }
  function submitGuess(event) {
    event.preventDefault();
    if (state.done || !state.answer) return;
    const guess = cleanPhrase(input.value);
    if (!validGuess(guess)) { statusEl.textContent='Hãy nhập hai từ có độ dài khớp với các ô trên bảng.'; statusEl.className='status error'; input.focus(); return; }
    if (state.guesses.some(x => phraseKey(x.text) === guess) || state.history.includes(guess)) {
      statusEl.textContent='Cụm này đã được đoán ở ván này hoặc ván trước. Hãy thử cụm khác.'; statusEl.className='status error'; showToast('Không lặp lại cụm đã đoán trước đó.'); input.select(); return;
    }
    const colors = evaluate(guess, state.answer);
    state.guesses.push({text:guess,colors}); state.history.push(guess); state.history=[...new Set(state.history)];
    input.value='';
    if (guess === state.answer) {
      state.done=true; state.won=true; state.used.push(state.answer); state.used=[...new Set(state.used)];
      statusEl.textContent='Chính xác! Bạn đã tìm ra đáp án.'; statusEl.className='status good'; input.disabled=true;
    } else if (state.guesses.length >= MAX_TRIES) {
      state.done=true; state.won=false; state.used.push(state.answer); state.used=[...new Set(state.used)];
      statusEl.textContent='Hết lượt! Đáp án là: '+state.answer.toLocaleUpperCase('vi'); statusEl.className='status error'; input.disabled=true;
    } else {
      statusEl.textContent='Chưa đúng — dựa vào màu các ô để thử tiếp.'; statusEl.className='status';
    }
    save(); render();
    if (guess === state.answer) playVictory();
    if (!state.done) input.focus({preventScroll:true});
  }
  function render() {
    board.innerHTML='';
    for(let r=0;r<MAX_TRIES;r++) {
      const row=document.createElement('div'); row.className='row';
      const item=state.guesses[r];
      const chars=item?letters(item.text):[];
      const wordLengths=state.answer?lengthsOf(state.answer):[3,3];
      const total=wordLengths.reduce((a,b)=>a+b,0);
      const availableWidth=Math.min(window.innerWidth-(window.innerWidth<=360?46:66),486);
      const tileSize=Math.max(16,Math.min(48,(availableWidth-(total-1)*4-10)/total));
      row.style.setProperty('--tile-size',tileSize+'px');
      let index=0;
      for(let word=0;word<wordLengths.length;word++) {
        if(word>0){const gap=document.createElement('div');gap.className='gap';row.appendChild(gap);}
        for(let j=0;j<wordLengths[word];j++,index++) {
          const tile=document.createElement('div'); tile.className='tile '+(item?item.colors[index]:'empty'); tile.textContent=(chars[index]||'').toLocaleUpperCase('vi'); tile.setAttribute('aria-label',item?`${tile.textContent}, ${colorName(item.colors[index])}`:'Ô trống'); row.appendChild(tile);
        }
      }
      board.appendChild(row);
    }
    const remaining=Math.max(0,MAX_TRIES-state.guesses.length);
    attemptsEl.textContent=state.done?(state.won?'Đã hoàn thành ván này':'Ván này đã kết thúc'):`Còn ${remaining} lượt`;
    input.disabled=state.done || !state.answer;
    $('getHint').disabled=state.done || !state.answer || state.clueShown;
    if(state.clueShown){const box=$('hintBox');box.textContent=hintMessage();box.hidden=false;$('getHint').textContent='💡 Đã mở gợi ý';}else{$('hintBox').hidden=true;$('getHint').textContent='💡 Gợi ý cụm từ';}
  }
  function colorName(c){return ({g:'đúng chữ, đúng chỗ',b:'đúng vị trí, sai dấu',y:'có trong cụm, sai chỗ',p:'không có trong cụm'})[c]||'';}
  $('guessForm').addEventListener('submit',submitGuess);
  $('newGame').addEventListener('click',startGame);
  $('getHint').addEventListener('click',giveHint);
  const modPanel = $('modPanel'), modToggle = $('modToggle');
  modToggle.addEventListener('click',()=>{const open=modPanel.hidden;modPanel.hidden=!open;modToggle.setAttribute('aria-expanded',String(open));});
  $('revealAnswer').addEventListener('click',()=>{if(!state.answer){showToast('Không còn ván đang chơi.');return;}statusEl.textContent='Đáp án: '+state.answer.toLocaleUpperCase('vi');statusEl.className='status good';});
  $('fillAnswer').addEventListener('click',()=>{if(!state.answer||state.done){showToast('Không còn ván đang chơi.');return;}input.value=state.answer;input.focus({preventScroll:true});statusEl.textContent='Đáp án đã được điền. Nhấn “Đoán” để xác nhận.';statusEl.className='status good';});
  $('solveNow').addEventListener('click',()=>{if(!state.answer||state.done){showToast('Không còn ván đang chơi.');return;}input.value=state.answer;submitGuess(new Event('submit',{cancelable:true}));});
  input.addEventListener('input',()=>{statusEl.textContent='Đoán cụm hai từ theo số ô trong bảng.';statusEl.className='status';});
  if (!state.answer && !state.done) startGame(); else { render(); if(state.done && state.answer) input.disabled=true; }
})();
</script>
